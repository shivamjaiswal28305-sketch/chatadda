<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ChatAdda — Free Live Chat, Video & Voice Call</title>
<meta name="description" content="ChatAdda par bina login ke free real-time chat karo — public chat room, private messaging, aur audio/video calling. Bas username daalo aur baat shuru karo.">
<meta name="keywords" content="free chat website, live chat, video call online, random chat, ladke ladki chat, chatadda">
<meta property="og:title" content="ChatAdda — Free Live Chat, Video & Voice Call">
<meta property="og:description" content="Bina login ke free real-time chat, private messaging aur video call.">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
</head>
<body>

  <!-- Username entry screen -->
  <div id="joinScreen" class="screen join-screen">
    <div class="string-lights" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="join-card">
      <img src="logo.svg" alt="ChatAdda logo" class="brand-logo" width="72" height="72">
      <h1>Chat<span>Adda</span></h1>
      <p class="tagline">Wahi chai-tapri wali baat — bas yahan chat pe. Naam daalo, adde pe aa jao.</p>
      <button id="googleSignInBtn" class="google-btn">Google se Sign in karo</button>
      <p id="signedInAs" class="hidden signed-in-as"></p>
      <button id="joinBtn" class="hidden">Adde pe chalo →</button>
      <p class="hint">Apna real naam, phone number, address kisi ajnabi ko na do. Suraksha aapke haath me hai.</p>
    </div>
  </div>

  <!-- Chat screen -->
  <div id="chatScreen" class="screen chat-screen hidden">
    <aside class="sidebar">
      <div class="sidebar-head">
        <img src="logo.svg" alt="ChatAdda" class="brand-logo-mini">
        <span>ChatAdda</span>
      </div>
      <button id="publicRoomBtn" class="room-item active" data-chat="public">
        <span class="room-icon">#</span> Adda Room (sabke saath)
      </button>

      <div class="online-label"><span class="pulse"></span> Private Chat (click naam pe)</div>
      <ul id="userList" class="user-list"></ul>
    </aside>

    <main class="chat-main">
      <header class="chat-header">
        <button id="menuBtn" class="menu-btn" aria-label="Users">☰</button>
        <div class="header-title" id="headerTitle">Adda Room</div>
        <div id="typingIndicator" class="typing-indicator"></div>
        <div id="chatActions" class="chat-actions hidden">
          <button id="audioCallBtn" class="action-btn" title="Audio Call">🎤 Call</button>
          <button id="videoCallBtn" class="action-btn" title="Video Call">📹 Video</button>
          <button id="blockBtn" class="action-btn" title="Block/Unblock">🚫 Block</button>
          <button id="reportBtn" class="action-btn" title="Report">⚠️ Report</button>
        </div>
      </header>

      <div id="messages" class="messages"></div>

      <form id="messageForm" class="message-form">
        <input id="messageInput" type="text" placeholder="Message likho..." autocomplete="off" maxlength="500">
        <button type="submit" aria-label="Send">➤</button>
      </form>
    </main>
  </div>

  <!-- Incoming call popup -->
  <div id="incomingCallModal" class="call-modal hidden">
    <div class="call-modal-card">
      <div class="ring-avatar"></div>
      <h2 id="incomingCallText">Incoming call...</h2>
      <p id="incomingCallType" class="call-type-label"></p>
      <div class="call-modal-actions">
        <button id="acceptCallBtn" class="call-btn accept">✅ Accept</button>
        <button id="rejectCallBtn" class="call-btn reject">❌ Reject</button>
      </div>
    </div>
  </div>

  <!-- Active call overlay -->
  <div id="activeCallOverlay" class="call-overlay hidden">
    <div class="call-top">
      <span id="callWithName">-</span>
      <span id="callTimer">00:00</span>
    </div>
    <div class="video-grid" id="videoGrid">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div id="audioCallVisual" class="audio-call-visual hidden">
      <div class="audio-avatar"></div>
      <p>Audio call chal rahi hai...</p>
    </div>
    <div id="filterBar" class="filter-bar hidden">
      <button class="filter-btn active" data-filter="none">Normal</button>
      <button class="filter-btn" data-filter="clarendon">Clarendon</button>
      <button class="filter-btn" data-filter="juno">Juno</button>
      <button class="filter-btn" data-filter="lark">Lark</button>
      <button class="filter-btn" data-filter="gingham">Gingham</button>
      <button class="filter-btn" data-filter="moon">Moon</button>
    </div>
    <canvas id="filterCanvas" style="display:none;"></canvas>
    <div class="call-controls">
      <button id="toggleMicBtn" class="call-control-btn">🎤</button>
      <button id="toggleCamBtn" class="call-control-btn">📹</button>
      <button id="endCallBtn" class="call-control-btn end">📞 End</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
        </html>
